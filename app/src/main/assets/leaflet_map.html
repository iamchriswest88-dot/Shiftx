<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <link rel="stylesheet" href="leaflet.css" />
    <script src="leaflet.js"></script>
    <style>
        body { padding: 0; margin: 0; background: #fff; }
        html, body, #map { height: 100%; width: 100vw; background: #fff; }
        .leaflet-container { background: #fff !important; }
        .marker-circle {
            width: 28px;
            height: 28px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 900;
            font-size: 13px;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            color: #0A0A0A;
            box-shadow: 0 2px 8px rgba(0,0,0,0.4);
            border: 2px solid rgba(255,255,255,0.9);
        }
        .marker-start {
            background: #86D17A;
        }
        .marker-end {
            background: #E0001B;
            color: #fff;
        }
        .marker-via {
            width: 16px;
            height: 16px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 700;
            font-size: 9px;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            color: #fff;
            background: #A855F7;
            border: 2px solid rgba(255,255,255,0.95);
            box-shadow: 0 1px 4px rgba(0,0,0,0.35);
        }
        .leaflet-control-zoom { display: none !important; }
        /* Frosted strip under the app's bottom drawer. backdrop-filter doesn't
           render in the Android WebView, so the frost is a second map kept in
           sync with the real one and blurred with a plain CSS filter — clipped
           to the strip, oversized by the blur radius to hide edge fringing,
           and aligned so its scene sits exactly over the real map's. */
        #frost {
            position: fixed;
            left: 0; right: 0; bottom: 0;
            height: 0;
            overflow: hidden;
            border-radius: 24px 24px 0 0;
            pointer-events: none;
            z-index: 2000;
            transition: height 140ms ease-out;
        }
        #frostView {
            position: absolute;
            left: -24px; bottom: -24px;
            width: calc(100% + 48px);
            height: calc(100vh + 48px);
            filter: blur(16px) saturate(1.35);
        }
        #mirror { width: 100%; height: 100%; background: #fff; }
        #frostTint {
            position: absolute;
            left: 0; top: 0; right: 0; bottom: 0;
            background: rgba(255, 255, 255, 0.35);
        }
    </style>
</head>
<body>
    <div id="map"></div>
    <div id="frost">
        <div id="frostView"><div id="mirror"></div></div>
        <div id="frostTint"></div>
    </div>
    <script>
        var map = L.map('map', { zoomControl: false }).setView([0, 0], 2);
        L.tileLayer('https://{s}.basemaps.cartocdn.com/light_all/{z}/{x}/{y}{r}.png', {
            maxZoom: 19,
            attribution: '&copy; OpenStreetMap &copy; CARTO'
        }).addTo(map);

        var routeLayer = L.layerGroup().addTo(map);
        // Kept so the route can be re-framed after the container resizes, which
        // happens whenever the activity drawer is dragged.
        var lastBounds = null;

        // The frost strip's blurred twin: same tiles, same view, no interaction.
        var mirror = L.map('mirror', {
            zoomControl: false, attributionControl: false,
            zoomAnimation: false, fadeAnimation: false, markerZoomAnimation: false,
            inertia: false, keyboard: false, dragging: false, touchZoom: false,
            scrollWheelZoom: false, doubleClickZoom: false, boxZoom: false
        });
        L.tileLayer('https://{s}.basemaps.cartocdn.com/light_all/{z}/{x}/{y}{r}.png', { maxZoom: 19 }).addTo(mirror);
        var mirrorRouteLayer = L.layerGroup().addTo(mirror);
        function syncMirror() {
            mirror.setView(map.getCenter(), map.getZoom(), { animate: false });
        }
        map.on('move zoom moveend zoomend viewreset resize', syncMirror);
        syncMirror();

        // bottomPad: CSS pixels of map hidden behind the app drawer. The route is
        // fitted into the visible strip above it — the map view never resizes,
        // only the framing changes.
        function refit(bottomPad) {
            map.invalidateSize();
            var pad = (typeof bottomPad === 'number' && isFinite(bottomPad) && bottomPad > 0) ? bottomPad : 0;
            document.getElementById('frost').style.height = pad + 'px';
            mirror.invalidateSize();
            syncMirror();
            if (lastBounds && lastBounds.isValid()) {
                map.fitBounds(lastBounds, {
                    paddingTopLeft: [30, 30],
                    paddingBottomRight: [30, 30 + pad]
                });
            }
        }
        var courseLayer = L.layerGroup().addTo(map);
        var segmentsLayer = L.layerGroup().addTo(map);
        var segmentOverlayLayer = L.layerGroup().addTo(map);
        var startMarker = null;
        var endMarker = null;

        var startIcon = L.divIcon({
            className: '',
            html: "<div class='marker-circle marker-start'>S</div>",
            iconSize: [28, 28],
            iconAnchor: [14, 14]
        });

        var endIcon = L.divIcon({
            className: '',
            html: "<div class='marker-circle marker-end'>F</div>",
            iconSize: [28, 28],
            iconAnchor: [14, 14]
        });

        var creationMode = window.location.href.indexOf('creationMode=true') !== -1; // Or set by Android

        // Setup click listener for course creation
        map.on('click', function(e) {
            if (window.Android) {
                window.Android.onMapClick(e.latlng.lat, e.latlng.lng);
            }
        });

        function drawRoute(latlngsJson, useZones) {
            console.log("drawRoute called with useZones=" + useZones);
            try {
                var dataPoints = typeof latlngsJson === 'string' ? JSON.parse(latlngsJson) : latlngsJson;
                console.log("Parsed " + dataPoints.length + " points");
                routeLayer.clearLayers();
                // Keep the frost's twin showing the same ride (one flat colour —
                // it only ever appears blurred).
                mirrorRouteLayer.clearLayers();
                if (dataPoints.length > 0) {
                    mirrorRouteLayer.addLayer(L.polyline(
                        dataPoints.map(function(pt) { return [pt[0], pt[1]]; }),
                        {color: '#C084FC', weight: 5}
                    ));
                }

                if (dataPoints.length > 0) {
                    var bounds = L.latLngBounds();
                    
                    if (!useZones) {
                        var latlngs = dataPoints.map(function(pt) { return [pt[0], pt[1]]; });
                        var pl = L.polyline(latlngs, {color: '#C084FC', weight: 5});
                        routeLayer.addLayer(pl);
                        bounds = pl.getBounds();
                    } else {
                        var getZoneColor = function(watts) {
                            if (watts == null) return '#808080';
                            if (watts < 150) return '#808080';
                            if (watts < 200) return '#5b92e5'; // Blue
                            if (watts < 250) return '#86D17A'; // Green
                            if (watts < 300) return '#ffc700'; // Yellow
                            if (watts < 350) return '#ff8c00'; // Orange
                            return '#e0001b'; // Red
                        };

                        for (var i = 0; i < dataPoints.length - 1; i++) {
                            var p1 = dataPoints[i];
                            var p2 = dataPoints[i+1];
                            var color = getZoneColor(p1[2]);
                            var pl = L.polyline([[p1[0], p1[1]], [p2[0], p2[1]]], {color: color, weight: 5});
                            routeLayer.addLayer(pl);
                            bounds.extend([p1[0], p1[1]]);
                            bounds.extend([p2[0], p2[1]]);
                        }
                    }
                    
                    lastBounds = bounds;
                    map.fitBounds(bounds);
                    setTimeout(function() {
                        map.invalidateSize();
                        map.fitBounds(bounds);
                    }, 100);
                    console.log("Route added to map");
                }
            } catch (e) {
                console.error("Error in drawRoute: " + e);
            }
        }

        function decodePolyline(str, precision) {
            var index = 0, lat = 0, lng = 0, coordinates = [], shift = 0, result = 0, byte = null, latitude_change, longitude_change, factor = Math.pow(10, Number.isInteger(precision) ? precision : 5);
            while (index < str.length) {
                byte = null; shift = 0; result = 0;
                do {
                    byte = str.charCodeAt(index++) - 63;
                    result |= (byte & 0x1f) << shift;
                    shift += 5;
                } while (byte >= 0x20);
                latitude_change = ((result & 1) ? ~(result >> 1) : (result >> 1));
                shift = result = 0;
                do {
                    byte = str.charCodeAt(index++) - 63;
                    result |= (byte & 0x1f) << shift;
                    shift += 5;
                } while (byte >= 0x20);
                longitude_change = ((result & 1) ? ~(result >> 1) : (result >> 1));
                lat += latitude_change;
                lng += longitude_change;
                coordinates.push([lat / factor, lng / factor]);
            }
            return coordinates;
        }

        // noFit: skip the camera jump — used by the live segment-creation
        // preview, where refitting on every tap would fight the rider's panning.
        function drawCourseRoute(encodedPolyline, noFit) {
            courseLayer.clearLayers();
            if (encodedPolyline) {
                var latlngs = decodePolyline(encodedPolyline);
                var pl = L.polyline(latlngs, {color: '#86D17A', weight: 4, dashArray: '5, 10'});
                courseLayer.addLayer(pl);
                if (!noFit && routeLayer.getLayers().length === 0) {
                    map.fitBounds(pl.getBounds(), {padding: [50, 50]});
                }
            }
        }

        // Numbered dots for the via points a segment is pinned through.
        var viaLayer = L.layerGroup().addTo(map);
        function showViaPoints(coordsJson) {
            viaLayer.clearLayers();
            try {
                var coords = JSON.parse(coordsJson);
                for (var i = 0; i < coords.length; i++) {
                    var icon = L.divIcon({
                        className: '',
                        html: "<div class='marker-via'>" + (i + 1) + "</div>",
                        iconSize: [16, 16],
                        iconAnchor: [8, 8]
                    });
                    viaLayer.addLayer(L.marker([coords[i][0], coords[i][1]], {icon: icon, interactive: false}));
                }
            } catch(e) {}
        }

        // Draw all segments as purple overlays. segmentsJson is an array of {id, polyline, selected}
        function drawSegments(segmentsJson) {
            segmentsLayer.clearLayers();
            try {
                var segments = typeof segmentsJson === 'string' ? JSON.parse(segmentsJson) : segmentsJson;
                var allBounds = L.latLngBounds();
                segments.forEach(function(seg) {
                    if (!seg.polyline) return;
                    var latlngs = decodePolyline(seg.polyline);
                    var isSelected = seg.selected === true;
                    var pl = L.polyline(latlngs, {
                        color: isSelected ? '#C97FFF' : '#9B40FF',
                        weight: isSelected ? 6 : 4,
                        opacity: isSelected ? 1.0 : 0.75
                    });
                    segmentsLayer.addLayer(pl);
                    latlngs.forEach(function(pt) { allBounds.extend(pt); });
                });
                if (allBounds.isValid() && routeLayer.getLayers().length === 0) {
                    map.fitBounds(allBounds, {padding: [40, 40]});
                    setTimeout(function() { map.invalidateSize(); map.fitBounds(allBounds, {padding: [40, 40]}); }, 150);
                }
            } catch(e) {
                console.error('drawSegments error: ' + e);
            }
        }

        function clearSegments() {
            segmentsLayer.clearLayers();
        }

        // Draw a segment overlay: thin blue stroke underneath, white line on top
        function drawSegmentOverlay(encodedPolyline) {
            if (!encodedPolyline) return;
            var latlngs = decodePolyline(encodedPolyline);
            // Blue border/stroke (slightly thicker, underneath)
            var stroke = L.polyline(latlngs, {
                color: '#C084FC',
                weight: 7,
                opacity: 0.9
            });
            // White fill on top (thinner)
            var fill = L.polyline(latlngs, {
                color: '#FFFFFF',
                weight: 4,
                opacity: 1.0
            });
            segmentOverlayLayer.addLayer(stroke);
            segmentOverlayLayer.addLayer(fill);
        }

        function clearSegmentOverlays() {
            segmentOverlayLayer.clearLayers();
        }

        function updateMarkers(startLat, startLng, endLat, endLng) {
            if (startMarker) map.removeLayer(startMarker);
            if (endMarker) map.removeLayer(endMarker);
            
            var bounds = L.latLngBounds();

            if (startLat !== null && startLng !== null) {
                startMarker = L.marker([startLat, startLng], {icon: startIcon, draggable: true}).addTo(map);
                startMarker.on('dragend', function(e) {
                    if (window.Android) window.Android.onMarkerMoved(true, e.target.getLatLng().lat, e.target.getLatLng().lng);
                });
                bounds.extend([startLat, startLng]);
            }
            if (endLat !== null && endLng !== null) {
                endMarker = L.marker([endLat, endLng], {icon: endIcon, draggable: true}).addTo(map);
                endMarker.on('dragend', function(e) {
                    if (window.Android) window.Android.onMarkerMoved(false, e.target.getLatLng().lat, e.target.getLatLng().lng);
                });
                bounds.extend([endLat, endLng]);
            }

            if (bounds.isValid() && routeLayer.getLayers().length === 0 && courseLayer.getLayers().length === 0) {
                map.fitBounds(bounds, {padding: [50, 50]});
            }
        }
    </script>
</body>
</html>
