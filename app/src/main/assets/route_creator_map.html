<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <link rel="stylesheet" href="leaflet.css" />
    <script src="leaflet.js"></script>
    <style>
        body { padding: 0; margin: 0; background: #121212; }
        html, body, #map { height: 100%; width: 100vw; background: #121212; }
        .leaflet-container { background: #121212 !important; }
        /* Only the tiles — the route, markers and frost sit in other panes. */
        .leaflet-tile-pane { filter: saturate(0.32) brightness(1.07) contrast(0.94); }
        .marker-start {
            width: 32px;
            height: 32px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 900;
            font-size: 14px;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            color: #0A0A0A;
            box-shadow: 0 2px 8px rgba(0,0,0,0.4);
            border: 2px solid rgba(255,255,255,0.9);
            background: #86D17A;
        }
        .marker-waypoint {
            width: 12px;
            height: 12px;
            border-radius: 50%;
            background: rgba(255, 199, 0, 0.6);
            border: 2px solid rgba(255, 199, 0, 0.9);
            box-shadow: 0 1px 4px rgba(0,0,0,0.3);
        }
        /* Frosted strip under the planner's bottom sheet. backdrop-filter
           doesn't render in the Android WebView, so the frost is a second map
           kept in sync and blurred with a plain CSS filter — same recipe as
           the activity map's #frost. */
        #frost {
            position: fixed;
            left: 0; right: 0; bottom: 0;
            height: 0;
            overflow: hidden;
            border-radius: 24px 24px 0 0;
            pointer-events: none;
            z-index: 2000;
            transition: height 140ms ease-out;
        }
        #frostView {
            position: absolute;
            left: -24px; bottom: -24px;
            width: calc(100% + 48px);
            height: calc(100vh + 48px);
            filter: blur(16px) saturate(1.35);
        }
        #mirror { width: 100%; height: 100%; background: #121212; }
        #frostTint {
            position: absolute;
            left: 0; top: 0; right: 0; bottom: 0;
            background: rgba(255, 255, 255, 0.35);
        }
    </style>
</head>
<body>
    <div id="map"></div>
    <div id="frost">
        <div id="frostView"><div id="mirror"></div></div>
        <div id="frostTint"></div>
    </div>
    <script>
        // OpenStreetMap's own tiles: no key, no account, no expiry. CARTO's
        // light_all basemap this used to draw was put behind an API key, and an
        // unkeyed request comes back as a tile telling the rider to get one —
        // the route drew fine over a wall of "API key required".
        //
        // OSM ships far more saturated than light_all did, so the tile pane is
        // desaturated in CSS back to the pale ground this map was drawn for:
        // the orange route has to stay the loudest thing on screen.
        var BASEMAP_URL = 'https://tile.openstreetmap.org/{z}/{x}/{y}.png';

        var map = L.map('map', { zoomControl: false }).setView([53.8, -1.5], 10);
        L.tileLayer(BASEMAP_URL, {
            maxZoom: 19,
            attribution: '&copy; OpenStreetMap contributors'
        }).addTo(map);
        
        map.locate({setView: true, maxZoom: 14});

        var startMarker = null;

        map.on('locationfound', function(e) {
            if (!startMarker) {
                setStartMarker(e.latlng.lat, e.latlng.lng);
                if (window.Android) {
                    window.Android.onStartLocationSet(e.latlng.lat, e.latlng.lng);
                }
            }
        });
        var routeLayer = L.layerGroup().addTo(map);
        var spurLayer = L.layerGroup().addTo(map);
        var waypointLayer = L.layerGroup().addTo(map);

        // The frost strip's blurred twin: same tiles, same view, no interaction.
        var mirror = L.map('mirror', {
            zoomControl: false, attributionControl: false,
            zoomAnimation: false, fadeAnimation: false, markerZoomAnimation: false,
            inertia: false, keyboard: false, dragging: false, touchZoom: false,
            scrollWheelZoom: false, doubleClickZoom: false, boxZoom: false
        });
        L.tileLayer(BASEMAP_URL, { maxZoom: 19 }).addTo(mirror);
        var mirrorRouteLayer = L.layerGroup().addTo(mirror);
        function syncMirror() {
            mirror.setView(map.getCenter(), map.getZoom(), { animate: false });
        }
        map.on('move zoom moveend zoomend viewreset resize', syncMirror);
        syncMirror();

        var startIcon = L.divIcon({
            className: '',
            html: '<div class="marker-start">S</div>',
            iconSize: [32, 32],
            iconAnchor: [16, 16]
        });

        var waypointIcon = L.divIcon({
            className: '',
            html: '<div class="marker-waypoint"></div>',
            iconSize: [12, 12],
            iconAnchor: [6, 6]
        });

        map.on('click', function(e) {
            setStartMarker(e.latlng.lat, e.latlng.lng);
            if (window.Android) {
                window.Android.onStartLocationSet(e.latlng.lat, e.latlng.lng);
            }
        });

        function setStartMarker(lat, lng) {
            if (startMarker) map.removeLayer(startMarker);
            startMarker = L.marker([lat, lng], {icon: startIcon, draggable: true}).addTo(map);
            startMarker.on('dragend', function(event) {
                var position = event.target.getLatLng();
                if (window.Android) {
                    window.Android.onStartLocationSet(position.lat, position.lng);
                }
            });
            map.setView([lat, lng], 13);
        }

        function displayRoute(coordsJson) {
            routeLayer.clearLayers();
            spurLayer.clearLayers();
            mirrorRouteLayer.clearLayers();
            try {
                var coords = JSON.parse(coordsJson);
                if (coords.length === 0) return;

                var latlngs = coords.map(function(c) { return [c[0], c[1]]; });
                // Twin copy for the frost strip — flat colour, only ever seen blurred.
                mirrorRouteLayer.addLayer(L.polyline(latlngs, {color: '#C084FC', weight: 5}));
                var polyline = L.polyline(latlngs, {
                    color: '#C084FC',
                    weight: 4,
                    opacity: 0.9,
                    smoothFactor: 1
                });
                routeLayer.addLayer(polyline);

                // Direction arrows along the loop so riding order is obvious
                // at a glance. Plain rotated glyphs — no plugin needed.
                var n = latlngs.length;
                if (n > 10) {
                    for (var f = 0.08; f < 0.97; f += 0.15) {
                        var i = Math.floor(f * (n - 1));
                        var j = Math.min(n - 1, i + 3);
                        if (i === j) continue;
                        var dLat = latlngs[j][0] - latlngs[i][0];
                        var dLng = (latlngs[j][1] - latlngs[i][1]) * Math.cos(latlngs[i][0] * Math.PI / 180);
                        var bearing = Math.atan2(dLng, dLat) * 180 / Math.PI;
                        var icon = L.divIcon({
                            className: '',
                            html: '<div style="transform:rotate(' + bearing + 'deg);font-size:14px;line-height:14px;' +
                                  'color:#7E22CE;text-shadow:0 0 3px #fff, 0 0 3px #fff;">▲</div>',
                            iconSize: [14, 14],
                            iconAnchor: [7, 7]
                        });
                        routeLayer.addLayer(L.marker([latlngs[i][0], latlngs[i][1]], {icon: icon, interactive: false}));
                    }
                }

                var bounds = polyline.getBounds();
                if (startMarker) bounds.extend(startMarker.getLatLng());
                lastBounds = bounds;
                map.fitBounds(bounds, {paddingTopLeft: [40, 40], paddingBottomRight: [40, 40 + lastPad]});
            } catch(e) {
                console.error('displayRoute error:', e);
            }
        }

        var lastBounds = null;
        var lastPad = 0;
        // bottomPad: CSS pixels of map hidden behind the drawer. Keeps the whole
        // route in the visible strip as the sheet moves or the route changes.
        function refit(bottomPad) {
            map.invalidateSize();
            lastPad = (typeof bottomPad === 'number' && isFinite(bottomPad) && bottomPad > 0) ? bottomPad : 0;
            document.getElementById('frost').style.height = lastPad + 'px';
            mirror.invalidateSize();
            syncMirror();
            if (lastBounds) {
                map.fitBounds(lastBounds, {paddingTopLeft: [40, 40], paddingBottomRight: [40, 40 + lastPad]});
            }
        }

        function highlightSpur(coordsJson) {
            spurLayer.clearLayers();
            try {
                var coords = JSON.parse(coordsJson);
                if (coords.length === 0) return;
                var latlngs = coords.map(function(c) { return [c[0], c[1]]; });
                var polyline = L.polyline(latlngs, {
                    color: '#FF4444',
                    weight: 6,
                    opacity: 0.8,
                    dashArray: '8, 8'
                });
                spurLayer.addLayer(polyline);
            } catch(e) {
                console.error('highlightSpur error:', e);
            }
        }

        function clearRoute() {
            routeLayer.clearLayers();
            spurLayer.clearLayers();
            waypointLayer.clearLayers();
            mirrorRouteLayer.clearLayers();
        }

        function showWaypoints(coordsJson) {
            waypointLayer.clearLayers();
            try {
                var coords = JSON.parse(coordsJson);
                for (var i = 0; i < coords.length; i++) {
                    L.marker([coords[i][0], coords[i][1]], {icon: waypointIcon}).addTo(waypointLayer);
                }
            } catch(e) {}
        }

        function centerOnLocation(lat, lng, zoom) {
            map.setView([lat, lng], zoom || 13);
        }
    </script>
</body>
</html>
