name: CI

# Compile check on every push. Releases are cut only by build-apk.yml
# (tag push or manual dispatch) — this workflow never publishes anything.
on:
  push:
    branches:
      - "**"

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Make gradlew executable
        run: chmod +x gradlew

      # AGP 9 renamed/restructured unit-test tasks, so discover the task name
      # instead of hardcoding one that a plugin upgrade can silently remove.
      - name: Unit tests
        run: |
          TASKS=$(./gradlew -q :app:tasks --all --no-daemon -PversionCode=1 -PversionName=ci || true)
          for CAND in testReleaseUnitTest testReleaseHostTest testDebugUnitTest testDebugHostTest; do
            if echo "$TASKS" | grep -q "$CAND"; then T=":app:$CAND"; break; fi
          done
          if [ -z "${T:-}" ]; then
            echo "No unit-test task found. Test-ish tasks were:"; echo "$TASKS" | grep -i test || true
            exit 1
          fi
          echo "Running $T"
          ./gradlew "$T" --no-daemon -PversionCode=1 -PversionName=ci

      - name: Build release APK
        run: ./gradlew :app:assembleRelease --no-daemon -PversionCode=1 -PversionName=ci

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: shiftx-ci-apk
          path: app/build/outputs/apk/release/app-release.apk
          retention-days: 7
